    <script type="importmap">{ "imports": {} }</script>

    <link rel="stylesheet" href="/blocks/trustpilot-widget/build/style.css">
    <!-- A theme that styles content elements, as most do (.entry-content X outranks a single class). -->
    <style>
        body { margin: 0; padding: 0 1rem; font-family: Georgia, serif; color: #222; background: #fff; }
        .entry-content h2 { margin: 2em 0 1em; font-size: 3rem; text-align: left; text-transform: uppercase; }
        .entry-content h3 { margin: 1.5em 0 0.5em; font-size: 2rem; letter-spacing: 0.2em; text-transform: lowercase; }
        .entry-content p { margin: 0 0 1.6em; }
        .entry-content ul, .entry-content ol { margin: 0 0 1.5em 3em; padding: 0; list-style: square; }
        .entry-content li { margin: 0 0 0.5em; padding: 0 0 0 0.5em; }
        .entry-content dl, .entry-content dd { margin: 0 0 1.5em 2.5em; }
        .entry-content dt { font-weight: 400; }
        .entry-content a { color: #0645ad; text-decoration: underline; }
        .entry-content address { margin: 0 0 1.5em; font-style: italic; }
        .entry-content strong { color: #c00; }
        .entry-content button { padding: 1em 2em; border: 2px outset #999; border-radius: 0; background: #e0e0e0; color: #333; font-family: Arial, sans-serif; text-transform: uppercase; }
        .entry-content iframe { width: 300px; height: 150px; margin: 0 0 1.5em; border: 3px solid #c00; }
        .entry-content img { margin: 1em; border: 5px solid gray; }
        .entry-content details { margin: 0 0 1em; padding: 1em; border: 1px solid #c00; }
        .entry-content summary { display: list-item; font-size: 1rem; font-weight: 400; }
    </style>
</head>
