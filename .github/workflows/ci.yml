name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > lint.txt 2>&1 || { cat lint.txt; status=1; }
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0)
          rm -f lint.txt
          exit $status
      - name: Unit tests
        run: php tests/php/run.php
      - name: WordPress security rules (PHPCS)
        if: matrix.php == '8.4'
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpcs

  js:
    name: Build, JS and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The committed build matches the sources
        run: |
          npm run build
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff --stat
            echo "::error::The build output is out of date: run npm run build and commit the result."
            exit 1
          fi
      - name: Unit tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser

  e2e:
    name: WP ${{ matrix.wp }} · WC ${{ matrix.wc }} · PHP ${{ matrix.php }} · ${{ matrix.theme }}
    needs: [php, js]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Closest to the store today: a classic theme on the versions it runs.
          - { wp: '6.8', wc: '9.9.5', php: '8.1', theme: storefront }
          - { wp: latest, wc: latest, php: '8.3', theme: storefront }
          - { wp: latest, wc: latest, php: '8.3', theme: twentytwentyfive }
    env:
      HIVE_E2E_WP: ${{ matrix.wp }}
      HIVE_E2E_WC: ${{ matrix.wc }}
      HIVE_E2E_PHP: ${{ matrix.php }}
      HIVE_E2E_THEME: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Screenshots, logs and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.theme }}-wp${{ matrix.wp }}-php${{ matrix.php }}
          path: |
            tests/e2e/.artifacts/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
